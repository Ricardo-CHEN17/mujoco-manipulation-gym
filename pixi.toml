version = "0.1.0"
description = "Industrial-grade robot simulation and manipulation framework"
authors = ["Yijin Chen<cyj070330@qq.com>"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
cmake = ">=3.22"
